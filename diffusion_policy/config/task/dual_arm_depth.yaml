name: dual_arm_depth

shape_meta: &shape_meta
  # Depth images replicated to 3 channels (for compatibility with RGB encoders)
  obs:
    left_hand_depth:
      shape: [3, 240, 320]  # 3 channels (depth replicated)
      type: rgb
    right_hand_depth:
      shape: [3, 240, 320]
      type: rgb
    head_depth:
      shape: [3, 240, 320]
      type: rgb
  action:
    shape: [14]  # left_arm(6) + left_gripper(1) + right_arm(6) + right_gripper(1)

dataset_path: &dataset_path data/dual_arm_demos

env_runner:
  # Offline-only dummy runner; skip rollouts
  _target_: diffusion_policy.env_runner.base_image_runner.NoOpImageRunner

dataset:
  _target_: diffusion_policy.dataset.dual_arm_depth_dataset.DualArmDepthDataset
  dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  depth_as_3channel: True  # Replicate depth to 3 channels for ResNet compatibility
