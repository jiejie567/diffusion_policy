defaults:
  - _self_
  - task: dual_arm_depth

name: train_diffusion_dual_arm_depth
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_image_workspace.TrainDiffusionUnetHybridImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16           # 预测轨迹总长度
n_obs_steps: 2        # 观测历史帧数（使用最近2帧深度图）
n_action_steps: 8     # 实际执行的动作步数（从16步中取前8步）
n_latency_steps: 0    # 0 表示无延迟，真实机器人部署时可能需要设为1-2
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

# Image observation settings
# Important: crop_shape should be smaller than input (240, 320)
crop_shape: [216, 288]  # Slightly smaller than 240x320 for data augmentation
obs_encoder_group_norm: True
eval_fixed_crop: True

policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100          # 训练扩散步数
    beta_start: 0.0001                # 噪声起始值
    beta_end: 0.02                    # 噪声结束值  
    beta_schedule: squaredcos_cap_v2  # 噪声调度策略
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  crop_shape: ${crop_shape}
  obs_encoder_group_norm: ${obs_encoder_group_norm}
  eval_fixed_crop: ${eval_fixed_crop}

  # UNet architecture
  diffusion_step_embed_dim: 256
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0 # 多少步后开始EMA
  inv_gamma: 1.0 
  power: 0.75          # EMA衰减指数
  min_value: 0.0
  max_value: 0.9999    # EMA最大衰减率

dataloader:
  batch_size: 128  # Doubled for 2 GPUs (64 per GPU)
  num_workers: 8   # Increased for faster data loading with 2 GPUs
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128  # Doubled for 2 GPUs
  num_workers: 8   # Increased for faster data loading
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4  # Base learning rate
  betas: [0.95, 0.999]     # Adam的动量参数
  eps: 1.0e-8      
  weight_decay: 1.0e-6     # L2正则化

training:
  device: "cuda:0"
  multi_gpu: True  # Enable multi-GPU training with DataParallel
  gpu_ids: [0, 1]  # Use GPU 0 and GPU 1
  seed: 42
  debug: False
  resume: True
  # optimization
  lr_scheduler: cosine    # 学习率调度器
  lr_warmup_steps: 500    # 预热步数
  num_epochs: 3000        # 总训练轮数
  gradient_accumulate_every: 1
  use_ema: True
  # training loop control
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_dual_arm
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
